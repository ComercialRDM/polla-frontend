<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Aplica dark mode ANTES del primer render de React para evitar el flash blanco.
         Espejo exacto de la lógica de ThemeContext.jsx (polla_tema + franja horaria). -->
    <script>
      (function() {
        try {
          var g = localStorage.getItem('polla_tema');
          var modo = (g === 'light' || g === 'dark' || g === 'auto') ? g : 'light';
          var dark = false;
          if (modo === 'dark') {
            dark = true;
          } else if (modo === 'auto') {
            var h = new Date().getHours();
            dark = h >= 19 || h < 6;
          }
          if (dark) document.documentElement.classList.add('dark');
        } catch(e) {}
      })();
    </script>

    <!-- Analítica (GA4, Clarity, Meta Pixel): los stubs solo encolan llamadas y no
         envían nada. Los scripts reales se cargan únicamente si el visitante aceptó las
         cookies en el banner (polla_cookies = 'aceptadas') y nunca en las rutas internas
         del panel, donde se ven datos personales de clientes. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.gtag = function(){ window.dataLayer.push(arguments); };
      // Consent Mode v2: todo denegado por defecto hasta que el visitante acepte.
      gtag('consent', 'default', {
        ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied', analytics_storage: 'denied'
      });

      if (!window.fbq) {
        var fbq = window.fbq = function(){
          fbq.callMethod ? fbq.callMethod.apply(fbq, arguments) : fbq.queue.push(arguments);
        };
        window._fbq = fbq;
        fbq.push = fbq; fbq.loaded = true; fbq.version = '2.0'; fbq.queue = [];
        fbq('init', '366212620395137');
        fbq('track', 'PageView');
      }

      window.clarity = window.clarity || function(){ (window.clarity.q = window.clarity.q || []).push(arguments); };

      (function() {
        var RUTAS_INTERNAS = /^\/(dashboardpollardm|adminqr|revisionboletas|acceso)(\/|$)/;
        window.__esRutaInterna = function(ruta) { return RUTAS_INTERNAS.test(ruta || window.location.pathname); };
        window.__consentimientoCookies = function() {
          try { return localStorage.getItem('polla_cookies'); } catch (e) { return null; }
        };

        // La llama el banner al pulsar "Aceptar" y esta misma página si ya se había aceptado.
        window.__cargarAnalitica = function() {
          if (window.__analiticaCargada) return;
          if (window.__consentimientoCookies() !== 'aceptadas' || window.__esRutaInterna()) return;
          window.__analiticaCargada = true;

          gtag('consent', 'update', {
            ad_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'granted', analytics_storage: 'granted'
          });
          var ga = document.createElement('script');
          ga.async = true;
          ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-B33ZXGVN96';
          document.head.appendChild(ga);
          gtag('js', new Date());
          gtag('config', 'G-B33ZXGVN96');

          var cl = document.createElement('script');
          cl.async = true;
          cl.src = 'https://www.clarity.ms/tag/km0g4nk651';
          document.head.appendChild(cl);

          var fb = document.createElement('script');
          fb.async = true;
          fb.src = 'https://connect.facebook.net/en_US/fbevents.js';
          document.head.appendChild(fb);
        };

        // Con consentimiento previo se mantiene la carga diferida (primera interacción o 3 s).
        if (window.__consentimientoCookies() === 'aceptadas' && !window.__esRutaInterna()) {
          ['click', 'scroll', 'touchstart', 'keydown'].forEach(function(ev) {
            window.addEventListener(ev, window.__cargarAnalitica, { once: true, passive: true });
          });
          setTimeout(window.__cargarAnalitica, 3000);
        }
      })();
    </script>
  </head>
