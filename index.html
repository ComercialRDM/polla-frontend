    <!-- Aplica dark mode ANTES del primer render de React para evitar el flash blanco.
         Espejo exacto de la lógica de ThemeContext.jsx (polla_tema + franja horaria). -->
    <script>
      (function() {
        try {
          var g = localStorage.getItem('polla_tema');
          var modo = (g === 'light' || g === 'dark' || g === 'auto') ? g : 'light';
          var dark = false;
          if (modo === 'dark') {
            dark = true;
          } else if (modo === 'auto') {
            var h = new Date().getHours();
            dark = h >= 19 || h < 6;
          }
          if (dark) document.documentElement.classList.add('dark');
        } catch(e) {}
      })();
    </script>

    <!-- Stubs de cola: se crean INMEDIATAMENTE para que React pueda llamar
         gtag/fbq/clarity en cualquier momento sin errores. Los scripts reales
         se cargan diferidos (primera interacción o 3 s). -->
    <script>
      // GA4 stub — dataLayer acepta eventos antes de que cargue el script
      window.dataLayer = window.dataLayer || [];
      window.gtag = function(){ window.dataLayer.push(arguments); };

      // Meta Pixel stub — fbq.queue almacena eventos hasta que fbevents.js los replay
      if (!window.fbq) {
        var fbq = window.fbq = function(){
          fbq.callMethod ? fbq.callMethod.apply(fbq, arguments) : fbq.queue.push(arguments);
        };
        window._fbq = fbq;
        fbq.push = fbq; fbq.loaded = true; fbq.version = '2.0'; fbq.queue = [];
        fbq('init', '366212620395137');
        fbq('track', 'PageView');
      }

      // Clarity stub — .q almacena llamadas hasta que clarity.js las replay
      window.clarity = window.clarity || function(){ (window.clarity.q = window.clarity.q || []).push(arguments); };
    </script>

    <!-- Carga diferida: los .js externos se descargan tras la primera interacción
         del usuario (scroll, click, tap, teclado) o pasados 3 s desde el load. -->
    <script>
      (function() {
        var cargado = false;
        function cargarScriptsTerceros() {
          if (cargado) return;
          cargado = true;

          // GA4 — el stub ya procesó los eventos; este script los reproduce
          var ga = document.createElement('script');
          ga.async = true;
          ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-B33ZXGVN96';
          document.head.appendChild(ga);
          gtag('js', new Date());
          gtag('config', 'G-B33ZXGVN96');

          // Clarity — el stub ya almacenó las llamadas en .q
          var cl = document.createElement('script');
          cl.async = true;
          cl.src = 'https://www.clarity.ms/tag/km0g4nk651';
          document.head.appendChild(cl);

          // Meta Pixel — el stub (fbq.queue) ya tiene init+PageView; fbevents.js los replay
          var fb = document.createElement('script');
          fb.async = true;
          fb.src = 'https://connect.facebook.net/en_US/fbevents.js';
          document.head.appendChild(fb);
        }

        ['click', 'scroll', 'touchstart', 'keydown'].forEach(function(ev) {
          window.addEventListener(ev, cargarScriptsTerceros, { once: true, passive: true });
        });
        setTimeout(cargarScriptsTerceros, 3000);
      })();
    </script>
